.bgshade{position:fixed;inset:0;z-index:0;background:linear-gradient(180deg,rgba(7,13,25,.62) 0%,rgba(7,13,25,.38) 30%,rgba(7,13,25,.5) 65%,rgba(7,13,25,.72) 100%)}
.snow{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.snow i{position:absolute;top:-12px;border-radius:50%;background:rgba(255,255,255,.85);animation:fall linear infinite}
@keyframes fall{to{transform:translate3d(36px,112vh,0)}}
.w{max-width:480px;margin:0 auto;padding:22px 16px 48px;position:relative;z-index:1}
.glassy,.hd,.box{background:var(--glass);border:1px solid var(--line);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.hd{display:flex;align-items:center;gap:12px;margin:6px 0 16px;padding:10px 14px;border-radius:16px}
.flag{width:52px;height:52px;flex:0 0 auto;filter:drop-shadow(0 0 8px rgba(143,214,255,.6));animation:spin 28s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ttl{direction:ltr;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;font-size:26px;font-weight:800;letter-spacing:4px;line-height:1.1;color:#fff;text-shadow:0 0 14px rgba(143,214,255,.7)}
.sub2{color:var(--mute);font-size:13px;margin-top:2px}
.box{border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.lbl{color:var(--mute);font-size:13px}
.bal{font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;font-size:38px;font-weight:800;margin:2px 0 0;color:var(--acc);text-shadow:0 0 16px rgba(95,227,161,.35)}
.bal.neg{color:var(--red);text-shadow:0 0 16px rgba(255,123,123,.4)}
.unit{font-size:14px;color:var(--mute);font-weight:400;text-shadow:none}
.tot{font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;font-size:24px;font-weight:800;color:#fff}
.statrow{display:flex;align-items:center;gap:10px;margin-top:6px}
.statrow.fine{color:var(--acc)}
.statrow.danger{color:var(--red)}
.stat{display:inline-block;padding:1px 10px;font-family:"Trebuchet MS",system-ui,sans-serif;font-size:12px;font-weight:700;letter-spacing:3px;border:1px solid currentColor;border-radius:999px}
.statrow.danger .stat{animation:pulse 1.3s ease-in-out infinite}
@keyframes pulse{50%{opacity:.4}}
.ecg{width:120px;height:30px;flex:0 0 auto;overflow:visible;filter:drop-shadow(0 0 4px currentColor)}
.ecg path{fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-dasharray:100;animation:ecg 2.8s linear infinite}
.statrow.danger .ecg path{animation-duration:1s}
@keyframes ecg{0%{stroke-dashoffset:100}55%{stroke-dashoffset:0}100%{stroke-dashoffset:-100}}
input{width:100%;font:inherit;font-size:18px;padding:12px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.09);color:#fff;margin-top:8px}
input::placeholder{color:rgba(255,255,255,.42)}
input:focus{outline:2px solid var(--ice);outline-offset:1px;background:rgba(255,255,255,.14)}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:12px 16px}
.main{position:relative;overflow:hidden;width:100%;margin-top:10px;background:linear-gradient(135deg,#4db2ff,#2a62d6);color:#fff;font-size:17px;font-weight:700;box-shadow:0 4px 16px rgba(54,128,235,.45)}
.main:active{transform:translateY(1px);filter:brightness(.92)}
.main::after{content:"";position:absolute;top:0;bottom:0;width:35%;left:-60%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.3),transparent);transform:skewX(-20deg);animation:sh 4s infinite}
@keyframes sh{to{left:140%}}
.main.alt{background:linear-gradient(135deg,#5b6b86,#2f3b52);box-shadow:0 4px 16px rgba(0,0,0,.4)}
.ghost{background:none;color:var(--mute);padding:6px 8px;font-size:14px}
.ghost.warn{color:var(--red)}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.amt{color:var(--red);font-weight:700;white-space:nowrap}
.amt.in{color:var(--acc)}
.sub{font-size:12px;color:var(--mute)}
.top{display:flex;justify-content:space-between;align-items:center;gap:6px}
.empty{color:var(--mute);text-align:center;padding:10px 0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 12px;margin-bottom:2px}
.chip{flex:0 0 auto;background:var(--glass);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid var(--line);color:#fff;border-radius:999px;padding:8px 16px;font-size:15px}
.chip.on{background:linear-gradient(135deg,#8fd6ff,#4db2ff);border-color:transparent;color:#07213a;font-weight:700}
.chip.add{color:var(--ice);border-style:dashed}
.cname{font-size:18px;font-weight:700}
.dsum{display:flex;gap:8px;margin:10px 0 8px}
.dsum>div{flex:1;text-align:center;border:1px solid var(--line);border-radius:12px;padding:6px 4px;background:rgba(255,255,255,.07)}
.dsum .v{font-weight:800;font-size:16px}
.dsum .unit{font-size:11px}
.dnet.neg{color:var(--red)}
.two{display:flex;gap:8px}
.two button{flex:1;padding:11px 8px;font-size:14px}
.dh{font-weight:700;margin:16px 0 2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}}
</style>
</head>
<body>
<div class="bgimg" aria-hidden="true"></div><div class="bgshade" aria-hidden="true"></div><div class="snow" aria-hidden="true"><i style="left:4%;width:4px;height:4px;animation-duration:11s;animation-delay:-0s;opacity:0.90"></i><i style="left:12%;width:6px;height:6px;animation-duration:14s;animation-delay:-4s;opacity:0.70"></i><i style="left:21%;width:3px;height:3px;animation-duration:9s;animation-delay:-7s;opacity:0.80"></i><i style="left:30%;width:5px;height:5px;animation-duration:13s;animation-delay:-2s;opacity:0.85"></i><i style="left:39%;width:4px;height:4px;animation-duration:10s;animation-delay:-9s;opacity:0.60"></i><i style="left:48%;width:7px;height:7px;animation-duration:16s;animation-delay:-5s;opacity:0.70"></i><i style="left:57%;width:3px;height:3px;animation-duration:9s;animation-delay:-1s;opacity:0.90"></i><i style="left:66%;width:5px;height:5px;animation-duration:12s;animation-delay:-8s;opacity:0.75"></i><i style="left:74%;width:4px;height:4px;animation-duration:11s;animation-delay:-3s;opacity:0.80"></i><i style="left:83%;width:6px;height:6px;animation-duration:15s;animation-delay:-6s;opacity:0.65"></i><i style="left:91%;width:3px;height:3px;animation-duration:9s;animation-delay:-10s;opacity:0.85"></i><i style="left:96%;width:5px;height:5px;animation-duration:13s;animation-delay:-12s;opacity:0.70"></i></div>
<div class="w">
  <div class="hd">
    <svg class="flag" viewBox="0 0 64 64" aria-hidden="true"><g stroke="#8fd6ff" stroke-width="3" stroke-linecap="round" fill="none"><path d="M32 8V56M11.2 20L52.8 44M11.2 44L52.8 20"/><circle cx="32" cy="32" r="8"/></g><g fill="#8fd6ff"><circle cx="32" cy="6" r="3.5"/><circle cx="32" cy="58" r="3.5"/><circle cx="9" cy="19" r="3.5"/><circle cx="55" cy="45" r="3.5"/><circle cx="9" cy="45" r="3.5"/><circle cx="55" cy="19" r="3.5"/></g></svg>
    <div><div class="ttl">FROST LEDGER</div><div class="sub2">موجودی کارت‌ها</div></div>
  </div>
  <div class="box" id="totBox"><div class="lbl">مجموع همه کارت‌ها</div><div class="tot" id="tot"></div></div>
  <div class="chips" id="chips"></div>

  <div class="box" id="addBox">
    <div class="lbl">کارت جدید</div>
    <input id="nameIn" placeholder="اسم کارت (مثلاً ملی، ملت)">
    <input id="initIn" inputmode="numeric" placeholder="موجودی فعلی کارت">
    <button class="main" id="addBtn">افزودن کارت</button>
    <button class="ghost" id="cancelAdd" style="width:100%;margin-top:6px">انصراف</button>
  </div>

  <div id="cardArea">
    <div class="box">
      <div class="top"><span class="cname" id="cn"></span>
        <span><button class="ghost" id="edit">تغییر موجودی</button><button class="ghost warn" id="del">حذف کارت</button></span></div>
      <div class="lbl" style="margin-top:6px">موجودی</div>
      <div class="bal" id="bal"></div>
      <div class="statrow fine" id="statrow"><div class="stat" id="stat"></div><svg class="ecg" viewBox="0 0 120 30" aria-hidden="true"><path pathLength="100" d="M0 15Q15 0 30 15T60 15T90 15T120 15"/></svg></div>
      <div id="editBox" style="display:none">
        <input id="editIn" inputmode="numeric" placeholder="موجودی جدید">
        <button class="main" id="editBtn">ثبت موجودی</button>
      </div>
    </div>
    <div class="box">
      <div class="lbl">خرج جدید</div>
      <input id="amtIn" inputmode="numeric" placeholder="مبلغ خرج">
      <input id="noteIn" placeholder="برای چی؟ (اختیاری)">
      <button class="main" id="spendBtn">خرج کردم</button>
    </div>
    <div class="box">
      <div class="lbl">افزایش موجودی</div>
      <input id="depIn" inputmode="numeric" placeholder="مبلغ واریزی">
      <input id="depNote" placeholder="از کجا؟ (اختیاری)">
      <button class="main" id="depBtn">واریز شد</button>
    </div>
    <div class="box">
      <div class="top"><span class="lbl">تراکنش‌های این کارت</span><button class="ghost" id="clear">پاک کردن لیست</button></div>
      <div id="list"></div>
    </div>
  </div>
  <div class="box" id="debtBox">
    <div class="cname">دفتر طلب و بدهی</div>
    <div class="dsum">
      <div><div class="lbl">طلب من</div><div class="v" style="color:var(--acc)" id="dOwed"></div></div>
      <div><div class="lbl">بدهی من</div><div class="v" style="color:var(--red)" id="dOwe"></div></div>
      <div><div class="lbl">خالص</div><div class="v dnet" id="dNet"></div></div>
    </div>
    <input id="dName" placeholder="اسم شخص">
    <input id="dAmt" inputmode="numeric" placeholder="مبلغ">
    <input id="dNote" placeholder="بابت چی؟ (اختیاری)">
    <div class="two"><button class="main" id="dOwedBtn">او به من بدهکاره</button><button class="main alt" id="dOweBtn">من بهش بدهکارم</button></div>
    <div class="dh">به من بدهکارن</div><div id="dListOwed"></div>
    <div class="dh">من بدهکارم به</div><div id="dListOwe"></div>
  </div>
</div>
<script>
var KEY="card-balance-v2",OLD="card-balance-v1",S={cards:[],cur:null},adding=false,editing=false;
try{var r=localStorage.getItem(KEY);
  if(r){var p=JSON.parse(r);if(p&&Array.isArray(p.cards))S=p;}
  else{var o=localStorage.getItem(OLD);
    if(o){var q=JSON.parse(o);
      if(q&&q.balance!==null&&q.balance!==undefined){var id=Date.now();S={cards:[{id:id,name:"کارت ۱",balance:q.balance,items:q.items||[]}],cur:id};}}}
}catch(e){}
if(!Array.isArray(S.debts))S.debts=[];
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function parse(v){
  v=String(v).replace(/[۰-۹]/g,function(d){return d.charCodeAt(0)-1776})
             .replace(/[٠-٩]/g,function(d){return d.charCodeAt(0)-1632})
             .replace(/[,،٬\s]/g,"");
  var n=Number(v);return isFinite(n)&&v!==""?n:NaN;
}
function fmt(n){return Number(n).toLocaleString("fa-IR")}
var $=function(i){return document.getElementById(i)};
function cur(){for(var i=0;i<S.cards.length;i++)if(S.cards[i].id===S.cur)return S.cards[i];return null;}
function armed(btn,label,fn){
  if(btn.dataset.a){clearTimeout(+btn.dataset.a);btn.dataset.a="";btn.textContent=btn.dataset.l;fn();return;}
  btn.dataset.l=btn.textContent;btn.textContent=label;
  btn.dataset.a=setTimeout(function(){btn.dataset.a="";btn.textContent=btn.dataset.l;},3000);
}
function render(){
  renderDebts();
  var c=cur();
  if(!c&&S.cards.length){S.cur=S.cards[0].id;c=S.cards[0];}
  var showAdd=adding||!S.cards.length;
  var sum=0;S.cards.forEach(function(k){sum+=k.balance});
  $("totBox").style.display=S.cards.length>1?"block":"none";
  $("tot").innerHTML=fmt(sum)+' <span class="unit">تومان</span>';
  var ch=$("chips");ch.innerHTML="";
  S.cards.forEach(function(k){
    var b=document.createElement("button");b.className="chip"+(k.id===S.cur&&!showAdd?" on":"");
    b.textContent=k.name;b.onclick=function(){S.cur=k.id;adding=false;editing=false;save();render();};
    ch.appendChild(b);
  });
  var a=document.createElement("button");a.className="chip add";a.textContent="+ کارت جدید";
  a.onclick=function(){adding=true;render();$("nameIn").focus();};
  if(S.cards.length)ch.appendChild(a);
  ch.style.display=S.cards.length?"flex":"none";
  $("addBox").style.display=showAdd?"block":"none";
  $("cancelAdd").style.display=S.cards.length?"block":"none";
  $("cardArea").style.display=(!showAdd&&c)?"block":"none";
  if(!c||showAdd)return;
  $("cn").textContent=c.name;
  $("bal").className="bal"+(c.balance<0?" neg":"");
  $("bal").innerHTML=fmt(c.balance)+' <span class="unit">تومان</span>';
  var ok=c.balance>0;$("stat").textContent=ok?"CLEAR":"BLIZZARD";$("stat").className="stat";$("statrow").className="statrow "+(ok?"fine":"danger");
  $("editBox").style.display=editing?"block":"none";
  var l=$("list");l.innerHTML="";
  if(!c.items.length){l.innerHTML='<div class="empty">هنوز تراکنشی ثبت نشده.</div>';return;}
  c.items.forEach(function(it){
    var d=document.createElement("div");d.className="row";
    var x1=document.createElement("div");
    var t=document.createElement("div");t.textContent=it.note||(it.kind==="in"?"واریز":"خرج");
    var s=document.createElement("div");s.className="sub";
    s.textContent=new Date(it.t).toLocaleString("fa-IR",{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"});
    x1.appendChild(t);x1.appendChild(s);
    var m=document.createElement("div");m.className="amt"+(it.kind==="in"?" in":"");m.textContent=(it.kind==="in"?"+":"−")+fmt(it.amt);
    var x=document.createElement("button");x.className="ghost";x.textContent="لغو";
    x.onclick=function(){c.balance+=(it.kind==="in"?-it.amt:it.amt);c.items=c.items.filter(function(q){return q.id!==it.id});save();render();};
    var rr=document.createElement("div");rr.style.cssText="display:flex;align-items:center;gap:4px";
    rr.appendChild(m);rr.appendChild(x);
    d.appendChild(x1);d.appendChild(rr);l.appendChild(d);
  });
}
$("addBtn").onclick=function(){
  var n=parse($("initIn").value);if(isNaN(n))return;
  var id=Date.now(),name=$("nameIn").value.trim()||("کارت "+fmt(S.cards.length+1));
  S.cards.push({id:id,name:name,balance:n,items:[]});S.cur=id;adding=false;
  $("nameIn").value="";$("initIn").value="";save();render();
};
$("cancelAdd").onclick=function(){adding=false;render();};
$("edit").onclick=function(){editing=!editing;render();if(editing){var c=cur();$("editIn").value="";$("editIn").focus();}};
$("editBtn").onclick=function(){var n=parse($("editIn").value);if(isNaN(n))return;cur().balance=n;editing=false;save();render();};
$("del").onclick=function(){var b=this;armed(b,"مطمئنی؟ دوباره بزن",function(){
  S.cards=S.cards.filter(function(k){return k.id!==S.cur});S.cur=S.cards.length?S.cards[0].id:null;editing=false;save();render();});};
function spend(){
  var c=cur(),n=parse($("amtIn").value);if(!c||isNaN(n)||n<=0)return;
  c.balance-=n;c.items.unshift({id:Date.now(),amt:n,note:$("noteIn").value.trim(),t:Date.now()});
  $("amtIn").value="";$("noteIn").value="";save();render();$("amtIn").focus();
}
$("spendBtn").onclick=spend;
$("amtIn").addEventListener("keydown",function(e){if(e.key==="Enter")spend()});
$("clear").onclick=function(){var b=this,c=cur();if(!c||!c.items.length)return;
  armed(b,"مطمئنی؟ دوباره بزن",function(){c.items=[];save();render();});};
function deposit(){
  var c=cur(),n=parse($("depIn").value);if(!c||isNaN(n)||n<=0)return;
  c.balance+=n;c.items.unshift({id:Date.now(),amt:n,kind:"in",note:$("depNote").value.trim(),t:Date.now()});
  $("depIn").value="";$("depNote").value="";save();render();
}
$("depBtn").onclick=deposit;
$("depIn").addEventListener("keydown",function(e){if(e.key==="Enter")deposit()});
function fillDebts(id,kind,msg){
  var l=$(id);l.innerHTML="";
  var arr=S.debts.filter(function(d){return d.kind===kind});
  if(!arr.length){l.innerHTML='<div class="empty">'+msg+'</div>';return;}
  arr.forEach(function(d){
    var row=document.createElement("div");row.className="row";
    var a=document.createElement("div");
    var t=document.createElement("div");t.textContent=d.who;t.style.fontWeight="700";
    var s2=document.createElement("div");s2.className="sub";
    s2.textContent=(d.note?d.note+" · ":"")+new Date(d.t).toLocaleDateString("fa-IR",{month:"short",day:"numeric"});
    a.appendChild(t);a.appendChild(s2);
    var m=document.createElement("div");m.className="amt"+(kind==="owed"?" in":"");m.textContent=fmt(d.amt);
    var x=document.createElement("button");x.className="ghost";x.textContent="تسویه شد";
    x.onclick=function(){armed(x,"مطمئنی؟",function(){S.debts=S.debts.filter(function(q){return q.id!==d.id});save();render();});};
    var r=document.createElement("div");r.style.cssText="display:flex;align-items:center;gap:4px";
    r.appendChild(m);r.appendChild(x);row.appendChild(a);row.appendChild(r);l.appendChild(row);
  });
}
function renderDebts(){
  var a=0,b=0;S.debts.forEach(function(d){if(d.kind==="owed")a+=d.amt;else b+=d.amt;});
  var net=a-b,u=' <span class="unit">تومان</span>';
  $("dOwed").innerHTML=fmt(a)+u;$("dOwe").innerHTML=fmt(b)+u;
  $("dNet").innerHTML=(net<0?"−":"")+fmt(Math.abs(net))+u;
  $("dNet").className="v dnet"+(net<0?" neg":"");
  fillDebts("dListOwed","owed","هیچ‌کس بهت بدهکار نیست.");
  fillDebts("dListOwe","owe","به کسی بدهکار نیستی.");
}
function addDebt(kind){
  var who=$("dName").value.trim(),n=parse($("dAmt").value);
  if(!who||isNaN(n)||n<=0)return;
  S.debts.unshift({id:Date.now(),who:who,amt:n,kind:kind,note:$("dNote").value.trim(),t:Date.now()});
  $("dName").value="";$("dAmt").value="";$("dNote").value="";save();render();
}
$("dOwedBtn").onclick=function(){addDebt("owed")};
$("dOweBtn").onclick=function(){addDebt("owe")};
function normD(v){return String(v).replace(/[۰-۹]/g,function(d){return d.charCodeAt(0)-1776}).replace(/[٠-٩]/g,function(d){return d.charCodeAt(0)-1632});}
function liveFmt(e){
  var el=e.target,pos=el.selectionStart,raw=el.value,cnt=0;
  for(var i=0;i<pos;i++)if(/[0-9۰-۹٠-٩]/.test(raw.charAt(i)))cnt++;
  var out=normD(raw).replace(/\D/g,"").replace(/\B(?=(\d{3})+(?!\d))/g,",");
  el.value=out;
  var p=0,c=0;while(p<out.length&&c<cnt){if(/\d/.test(out.charAt(p)))c++;p++;}
  try{el.setSelectionRange(p,p);}catch(x){}
}
["initIn","editIn","amtIn","depIn","dAmt"].forEach(function(id){$(id).addEventListener("input",liveFmt);});
render();
try{Telegram.WebApp.ready();Telegram.WebApp.expand();}catch(e){}
</script>
</body>
</html>
